<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corporate Chaos - Game Board</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Kanit', sans-serif; }
        body { background-color: #080c14; color: #fff; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .controls { background: #1e293b; padding: 15px; border-radius: 12px; margin-bottom: 20px; display: flex; gap: 10px; align-items: center; }
        input, button { padding: 8px 16px; border-radius: 8px; border: none; font-weight: 600; }
        button { background: #6366f1; color: white; cursor: pointer; }
        button.gold { background: #fbbf24; color: black; }
        .board-container { position: relative; width: 900px; height: 500px; background: rgba(15, 23, 42, 0.9); border-radius: 24px; border: 2px solid rgba(255,255,255,0.1); }
        .tile { position: absolute; width: 60px; height: 40px; border-radius: 20px; border: 2px solid #06b6d4; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; background: rgba(0,0,0,0.5); }
        .tile.inner { border-color: #fbbf24; }
        .player-token { position: absolute; width: 28px; height: 28px; background: #ef4444; border: 2px solid white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; transition: all 0.3s; z-index: 10; }
        .log-box { width: 900px; background: #1e293b; padding: 12px; border-radius: 8px; margin-top: 15px; font-size: 0.85rem; height: 100px; overflow-y: auto; }
    </style>
</head>
<body>

    <div class="controls">
        <input type="text" id="nameInput" placeholder="ใส่ชื่อของคุณ">
        <button onclick="createRoom()">สร้างห้องใหม่</button>
        <input type="text" id="roomInput" placeholder="รหัสห้อง 4 หลัก" style="width: 120px;">
        <button onclick="joinRoom()">เข้าร่วมห้อง</button>
        <button class="gold" onclick="addBot()">+ เพิ่มบอท AI</button>
        <button class="gold" onclick="rollDice()">🎲 ทอยเต๋า</button>
    </div>

    <div style="margin-bottom: 10px; color: #fbbf24;" id="roomStatus">ยังไม่ได้เข้าห้อง</div>

    <div class="board-container" id="board">
        <!-- Tokens -->
        <div class="player-token" id="pToken" style="display:none;">🚀</div>
    </div>

    <div class="log-box" id="gameLog">
        <div>ยินดีต้อนรับสู่ บริษัท โตเกียว จำกัด! พิมพ์ชื่อแล้วกดสร้างห้องได้เลย</div>
    </div>

    <script>
        const socket = io();
        let currentRoomId = null;

        // วาดกระดานวงนอกและวงในแบบคร่าวๆ
        const board = document.getElementById('board');
        for(let i=0; i<24; i++) {
            const tile = document.createElement('div');
            tile.className = 'tile';
            let x = 40 + (i < 8 ? i*100 : (i < 12 ? 700 : (i < 20 ? (20-i)*100 : 0)));
            let y = 30 + (i < 8 ? 0 : (i < 12 ? (i-7)*90 : (i < 20 ? 410 : (24-i)*90)));
            tile.style.left = x + 'px';
            tile.style.top = y + 'px';
            tile.innerText = i + 1;
            board.appendChild(tile);
        }

        function log(msg) {
            const box = document.getElementById('gameLog');
            box.innerHTML += `<div>${msg}</div>`;
            box.scrollTop = box.scrollHeight;
        }

        function createRoom() {
            const name = document.getElementById('nameInput').value;
            socket.emit('createRoom', name);
        }

        function joinRoom() {
            const name = document.getElementById('nameInput').value;
            const roomId = document.getElementById('roomInput').value.toUpperCase();
            socket.emit('joinRoom', { roomId, playerName: name });
        }

        function addBot() {
            if (currentRoomId) socket.emit('addBot', currentRoomId);
        }

        function rollDice() {
            if (currentRoomId) socket.emit('rollDice', currentRoomId);
        }

        socket.on('roomCreated', (data) => {
            currentRoomId = data.roomId;
            document.getElementById('roomStatus').innerText = `รหัสห้องของคุณ: ${currentRoomId} (ตำแหน่ง: ${data.player.role.name})`;
            log(`สร้างห้องสำเร็จ! รหัสห้อง: <strong>${currentRoomId}</strong> ส่งรหัสนี้ให้เพื่อนเข้ามาเล่นได้เลย`);
        });

        socket.on('updateRoom', (room) => {
            currentRoomId = room.id;
            document.getElementById('roomStatus').innerText = `รหัสห้อง: ${currentRoomId} | ผู้เล่นในห้อง: ${room.players.length}/6 คน`;
            
            // แสดง Token ผู้เล่น
            const token = document.getElementById('pToken');
            token.style.display = 'flex';
        });

        socket.on('diceRolled', (data) => {
            log(`🎲 <strong>${data.playerName}</strong> ทอยได้ ${data.diceValue} (เดินไปช่อง ${data.newPos + 1})`);
        });

        socket.on('errorMsg', (msg) => alert(msg));
    </script>
</body>
</html>
